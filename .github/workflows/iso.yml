name: AetherOS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    name: Compile AetherOS kernel from kernel.org source
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl xz-utils libarchive-tools build-essential flex bison libssl-dev libelf-dev bc cpio python3 dpkg-dev rsync ca-certificates debhelper kmod >/dev/null
          chmod +x build/kernel/build.sh
          ./build/kernel/build.sh
      - name: Upload kernel package
        uses: actions/upload-artifact@v4
        with:
          name: linux-image-aether
          path: dist/linux-image-aether_*.deb

  iso:
    name: Assemble AetherOS 1.0 ISO
    needs: kernel
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      # live-build must mount /proc, /dev/pts and bind-mount into the chroot;
      # GH-hosted containers drop CAP_SYS_ADMIN unless --privileged is set.
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq live-build debootstrap debian-archive-keyring squashfs-tools xorriso mtools dosfstools grub-efi-amd64-bin grub-pc-bin qemu-system-x86 python3 curl ca-certificates git jq >/dev/null
      - name: Fetch kernel package
        uses: actions/download-artifact@v4
        with:
          name: linux-image-aether
          path: artifact-kernel
      - name: Stage kernel into live-build
        run: |
          mkdir -p build/distro/config/packages.chroot
          cp artifact-kernel/linux-image-aether_*.deb build/distro/config/packages.chroot/
          ls -la build/distro/config/packages.chroot/
      - name: Build ISO
        run: |
          chmod +x build/distro/build.sh
          ./build/distro/build.sh all
          ls -la dist/
          sha256sum dist/*.iso | tee dist/SHA256SUMS
      - name: Verify ISO structure
        run: |
          ISO=$(ls dist/*.iso | head -1)
          echo "ISO: $ISO ($(stat -c%s "$ISO") bytes)"
          file "$ISO"
          xorriso -indev "$ISO" -report_el_torito as_mkisofs 2>/dev/null | head -20
          test -s "$ISO" && echo "STRUCTURE OK"
      - name: Smoke boot (QEMU)
        run: |
          ISO=$(ls dist/*.iso | head -1)
          ACCEL=tcg
          if [ -w /dev/kvm ]; then ACCEL=kvm; echo "KVM available"; else echo "no KVM — TCG fallback"; fi
          # Forensics (rounds 9-10): show the bootloader config actually inside the ISO
          mkdir -p isopeek
          xorriso -osirrox on -indev "$ISO" -extract /isolinux isopeek/isolinux 2>/dev/null || true
          for c in isopeek/isolinux/*.cfg; do echo "### $c"; head -25 "$c"; done
          # Boot the kernel DIRECTLY (-kernel): proves OUR kernel + initramfs +
          # squashfs + live userspace without betting on isolinux rendering to a
          # headless VGA. (isolinux itself stays the stock Debian chain.)
          KV=$(xorriso -indev "$ISO" -find /live -name 'vmlinuz-*' 2>/dev/null | head -1)
          test -n "$KV" || { echo "no kernel in /live"; exit 1; }
          KBASE=$(basename "$KV"); IBASE=$(echo "$KBASE" | sed 's/^vmlinuz/initrd.img/')
          xorriso -osirrox on -indev "$ISO" -extract "/live/$KBASE" isopeek/vmlinuz
          xorriso -osirrox on -indev "$ISO" -extract "/live/$IBASE" isopeek/initrd.img
          test -s isopeek/vmlinuz && test -s isopeek/initrd.img && echo "extracted $KBASE + $IBASE"
          timeout 900 qemu-system-x86_64 -machine pc -m 3072 -smp 2 \
            -accel "$ACCEL" -kernel isopeek/vmlinuz -initrd isopeek/initrd.img \
            -append "boot=live components splash live-config.hostname=aetheros live-config.username=aether live-config.user-default-passwd=aether live-config.locale=en_US.UTF-8 live-config.timezone=Etc/UTC console=ttyS0,115200" \
            -cdrom "$ISO" -display none -no-reboot \
            -serial file:serial.log || true
          echo "--- serial head ---"; head -5 serial.log || true
          echo "--- serial tail ---"; tail -30 serial.log || true
          if grep -qE "Linux version 6\.12" serial.log; then echo "KERNEL BOOTED: AetherOS 6.12 kernel is alive"; else echo "kernel banner not seen"; exit 1; fi
          grep -qE "Reached target|Welcome to|systemd" serial.log && echo "INIT ALIVE: systemd reached boot targets" || true
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-iso
          path: |
            dist/*.iso
            dist/SHA256SUMS
            serial.log
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: ./ci/release.sh
